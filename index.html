<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>A&amp;P2 Test 2 Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one sticky header with section tabs; each section is a work area (stage on top, controls beside or below). Palette borrows H&E stain: hematoxylin purple + eosin pink on slide-glass white. */
:root {
  --paper: #f6f5f9; --card: #ffffff; --ink: #1f1a2b; --muted: #645e73; --line: #dcd8e5;
  --hema: #4b3a8f; --hema-soft: #ebe7f8; --eosin: #c4406b; --eosin-soft: #fbe6ee;
  --ok: #1d7a4d; --ok-soft: #e1f3e9; --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #9a6400; --warn-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(31,26,43,.06), 0 4px 14px rgba(31,26,43,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #13111a; --card: #1c1926; --ink: #ece9f4; --muted: #a8a1b8; --line: #2e2a3b;
  --hema: #a99cf2; --hema-soft: #2a2442; --eosin: #f27ba1; --eosin-soft: #3a1f2b;
  --ok: #62cf95; --ok-soft: #173326; --bad: #ff8b80; --bad-soft: #3b1d1b; --warn: #f0c060; --warn-soft: #3a2f14;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #13111a; --card: #1c1926; --ink: #ece9f4; --muted: #a8a1b8; --line: #2e2a3b;
  --hema: #a99cf2; --hema-soft: #2a2442; --eosin: #f27ba1; --eosin-soft: #3a1f2b;
  --ok: #62cf95; --ok-soft: #173326; --bad: #ff8b80; --bad-soft: #3b1d1b; --warn: #f0c060; --warn-soft: #3a2f14;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--hema); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }

.top { position: -webkit-sticky; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 6px; flex-wrap: wrap; }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
.brand h1 span { color: var(--eosin); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .78rem; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--paper); white-space: nowrap; }
.chip b { color: var(--hema); }
.tabs { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.more-r { -webkit-mask-image: linear-gradient(to right, #000 80%, transparent); mask-image: linear-gradient(to right, #000 80%, transparent); }
.tabs.more-l { -webkit-mask-image: linear-gradient(to left, #000 80%, transparent); mask-image: linear-gradient(to left, #000 80%, transparent); }
.tabs.more-l.more-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); }
.tab { flex: 0 0 auto; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: .93rem; color: var(--muted); }
@media (hover: hover) { .tab:hover { color: var(--ink); background: var(--paper); } }
.tab[aria-selected="true"] { color: var(--hema); background: var(--hema-soft); border-color: var(--hema-soft); }
.tab .n { font-family: var(--f-mono); font-size: .72rem; margin-left: 4px; background: var(--eosin); color: var(--card); border-radius: 999px; padding: 1px 6px; }

main.wrap { padding-block: 18px 60px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.view-head h2 { font-size: 1.6rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--eosin); }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 14px; font-weight: 700; }
@media (hover: hover) { .btn:hover { border-color: var(--hema); } }
.btn.primary { background: var(--hema); color: var(--card); border-color: var(--hema); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; font-size: .9rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--hema-soft); color: var(--hema); }
select.pick { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 10px; max-width: 100%; min-width: 0; }
label.tog { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }

/* Figures */
.fig-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.fig-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.fig-tools .pick { flex: 1 1 260px; }
.stage { padding: 10px; }
.stage-title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 2px 4px 8px; }
.stage-title h3 { font-size: 1.05rem; }
.stage-title .meta { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.canvas { position: relative; background: #ffffff; border-radius: 8px; }
.canvas img { display: block; width: 100%; height: auto; border-radius: 8px; }
.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #ffffff; background: #8a8496; color: #ffffff; font: 700 11px/22px var(--f-mono); text-align: center; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.pin.cur { background: #c4406b; -webkit-animation: pulse 1.4s ease-in-out infinite; animation: pulse 1.4s ease-in-out infinite; z-index: 3; width: 30px; height: 30px; margin: -15px 0 0 -15px; line-height: 26px; font-size: 12px; }
.pin.right { background: #1d7a4d; }
.pin.wrong { background: #b3261e; }
.pin.study { background: #4b3a8f; }
@-webkit-keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,64,107,.55); } 50% { box-shadow: 0 0 0 9px rgba(196,64,107,0); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,64,107,.55); } 50% { box-shadow: 0 0 0 9px rgba(196,64,107,0); } }
@media (prefers-reduced-motion: reduce) { .pin.cur { -webkit-animation: none; animation: none; } }
.tip { position: absolute; z-index: 5; background: #1f1a2b; color: #ffffff; font-size: .82rem; line-height: 1.3; padding: 6px 9px; border-radius: 6px; max-width: 220px; pointer-events: none; -webkit-transform: translate(-50%, -100%); transform: translate(-50%, -100%); margin-top: -18px; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.ask { padding: 16px; display: flex; flex-direction: column; gap: 12px; position: -webkit-sticky; position: sticky; top: 120px; }
.ask .qline { font-family: var(--f-display); font-size: 1.25rem; font-weight: 800; }
.ask .qline em { font-style: normal; color: var(--eosin); }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 10px 12px; font-size: .97rem; line-height: 1.3; }
@media (hover: hover) { .choice:hover:not(:disabled) { border-color: var(--hema); background: var(--hema-soft); } }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
.typebox { display: flex; gap: 8px; }
.typebox input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--paper); }
.fb { border-radius: 9px; padding: 10px 12px; font-size: .95rem; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.fb.close { background: var(--warn-soft); color: var(--warn); }
.fb b { color: var(--ink); }
.progress { height: 6px; background: var(--paper); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--hema); width: 0; -webkit-transition: width .25s; transition: width .25s; }
.small { font-size: .85rem; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tagq { font-family: var(--f-mono); font-size: .7rem; color: var(--ok); font-weight: 700; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }

/* Histology */
.histo-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.scope { position: relative; border-radius: 50%; overflow: hidden; width: 100%; max-width: 460px; margin: 0 auto; border: 10px solid var(--ink); box-shadow: inset 0 0 40px rgba(0,0,0,.35), var(--shadow); background: #ffffff; }
.scope::after { content: ""; display: block; padding-bottom: 100%; }
.scope img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.scope-wrap { padding: 16px; }
.organs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
details.feat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0; }
details.feat summary { cursor: pointer; padding: 12px 14px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.feat summary::-webkit-details-marker { display: none; }
details.feat summary::after { content: "+"; font-family: var(--f-mono); color: var(--hema); }
details.feat[open] summary::after { content: "\2212"; }
details.feat dl { margin: 0; padding: 0 14px 14px; display: grid; gap: 6px; font-size: .92rem; }
details.feat dt { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--eosin); margin-top: 4px; }
details.feat dd { margin: 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.gallery img { display: block; width: 100%; background: #ffffff; }
.gallery figcaption { padding: 8px 10px; font-size: .85rem; font-weight: 700; }
.section-label { margin: 28px 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-label h3 { font-size: 1.15rem; }

/* Experiment */
.tubes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tube { padding: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.tube h4 { margin: 0; font-family: var(--f-mono); font-size: 1rem; color: var(--hema); }
.tube .what { font-size: .9rem; margin: 2px 0 6px; }
.tube .temp { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.pm { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: .82rem; }
.pm .lab { width: 74px; color: var(--muted); }
.pm button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; width: 36px; height: 30px; font-family: var(--f-mono); font-weight: 700; }
.pm button[aria-pressed="true"] { background: var(--hema); border-color: var(--hema); color: var(--card); }
.pm button.right { background: var(--ok); border-color: var(--ok); color: var(--card); }
.pm button.wrong { background: var(--bad); border-color: var(--bad); color: var(--card); }
.why { font-size: .82rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); }
.why b { color: var(--ink); }
.subtabs { margin-bottom: 12px; }
table.vt { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tablebox { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.vt th, table.vt td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
table.vt th { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.hide-cell { background: var(--hema-soft); color: transparent; border-radius: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.hide-cell::after { content: "Tap to show"; color: var(--hema); font-family: var(--f-mono); font-size: .72rem; }
.hide-cell.shown { background: transparent; color: var(--ink); cursor: default; }
.hide-cell.shown::after { content: none; }

/* Lab quiz + How it works */
.lq { display: grid; gap: 12px; }
.lqc { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.lqc input { flex: 0 0 auto; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--hema); }
.lqc:not(.right):not(.wrong):has(input:checked) { border-color: var(--hema); background: var(--hema-soft); }
.mrow { display: grid; gap: 6px; font-size: .95rem; line-height: 1.3; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; }
.mrow.right { border-color: var(--ok); background: var(--ok-soft); }
.mrow.wrong { border-color: var(--bad); background: var(--bad-soft); }
.jump { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; margin-bottom: 12px; font-size: .85rem; }
.jump span { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.jump button { border: 0; background: transparent; color: var(--hema); font-weight: 700; padding: 6px 8px; border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; }
.guide { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 860px; }
.guide section { min-width: 0; padding: 16px 18px; scroll-margin-top: 140px; }
.guide table.vt td { min-width: 110px; }
.guide table.vt td:first-child { min-width: 0; }
.guide h3 { font-size: 1.15rem; margin-bottom: 8px; }
.guide h4 { font-size: 1rem; margin: 14px 0 6px; }
.guide p { margin: 0 0 10px; }
.guide ul { margin: 0 0 10px; padding-left: 20px; }
.guide li { margin-bottom: 4px; }
.guide .key { background: var(--hema-soft); border-radius: 9px; padding: 10px 12px; margin: 10px 0; }
.guide .tablebox { margin-top: 8px; }
.trap li b { color: var(--bad); }

/* Quiz + cards */
.qcard { padding: 20px; max-width: 760px; }
.qcard .src { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.qcard .qtext { font-size: 1.15rem; font-weight: 700; margin: 6px 0 12px; }
.qcard img { display: block; max-width: 100%; max-height: 360px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 12px; }
.reveal { background: var(--hema-soft); border-radius: 9px; padding: 12px; }
.flash { padding: 24px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 760px; cursor: pointer; }
.flash .front { font-family: var(--f-display); font-size: 1.5rem; font-weight: 800; }
.flash .back { font-size: 1.05rem; border-top: 1px solid var(--line); padding-top: 14px; }
.deck-list { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.deck-list button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 700; color: var(--muted); }
.deck-list button[aria-pressed="true"] { border-color: var(--hema); color: var(--hema); background: var(--hema-soft); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; }
.chain button { border: 1px dashed var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
.chain .slot { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .88rem; background: var(--paper); min-width: 40px; }
.chain .slot.ok { border-color: var(--ok); background: var(--ok-soft); }
.chain .slot.no { border-color: var(--bad); background: var(--bad-soft); }

/* Review */
.miss { display: grid; gap: 8px; }
.miss .it { padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.miss .it .k { font-family: var(--f-mono); font-size: .7rem; color: var(--eosin); text-transform: uppercase; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

@media (max-width: 900px) {
  .fig-layout, .histo-layout { grid-template-columns: minmax(0, 1fr); }
  .ask { position: static; }
}
@media (max-width: 480px) {
  .view-head h2 { font-size: 1.35rem; }
  .pin { width: 22px; height: 22px; margin: -11px 0 0 -11px; line-height: 18px; font-size: 10px; }
  .pin.cur { width: 26px; height: 26px; margin: -13px 0 0 -13px; line-height: 22px; }
  .organs { grid-template-columns: 1fr; }
  .chip.exam { display: none; }
  .brand { padding-block: 8px 4px; }
  .brand h1 { font-size: 1.1rem; }
  .flash .front { font-size: 1.25rem; }
  .fig-tools .pick { flex-basis: 100%; }
  .qcard, .flash { padding: 16px; }
}
@media (pointer: coarse) {
  button, select, summary, .hide-cell { touch-action: manipulation; }
  .btn, .seg button, .tab, .choice, .deck-list button, .chain button, select.pick, .typebox input { min-height: 44px; }
  .pm button { width: 44px; height: 40px; }
  label.tog { min-height: 44px; }
  label.tog input { width: 20px; height: 20px; }
}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>A&amp;P2 Test 2 <span>Review</span></h1>
      <div class="stats" aria-live="polite">
        <span class="chip">Session <b id="s-score">0/0</b></span>
        <span class="chip">To review <b id="s-miss">0</b></span>
        <span class="chip exam">Exam Thu Oct 29</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Study sections">
      <button class="tab" role="tab" data-view="figures">Figures</button>
      <button class="tab" role="tab" data-view="histology">Histology</button>
      <button class="tab" role="tab" data-view="experiment">Ex 39 experiment</button>
      <button class="tab" role="tab" data-view="quiz">Quiz bank</button>
      <button class="tab" role="tab" data-view="cards">Flashcards</button>
      <button class="tab" role="tab" data-view="review">Review missed<span class="n" id="tab-miss" hidden>0</span></button>
    </nav>
  </div>

pithelium", "simple squamous epithelium", "simple cuboidal epithelium"], "a": "simple squamous epithelium", "img": null}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the structure marked by the red curve (on the lung/bronchial tree model).", "type": "id", "choices": ["Tertiary bronchi", "Trachea", "Carina", "Secondary bronchi", "Primary Bronchus"], "a": "Carina", "img": "img/q/5.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the structure labeled D (sinus figure).", "type": "id", "choices": ["Uvula", "Maxillary sinus", "Pharyngeal tonsil", "Sphenoid sinus", "Inferior nasal concha", "Frontal sinus"], "a": "Maxillary sinus", "img": "img/q/6.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "The right lung has superior, middle, and inferior lobes. Which lobe is missing on the left side?", "type": "mc", "choices": ["inferior", "middle", "superior"], "a": "middle", "img": null}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the structure labeled A (head model, midsagittal).", "type": "id", "choices": ["Middle nasal concha", "Inferior nasal concha", "Superior nasal conchae", "Sphenoid sinus"], "a": "Inferior nasal concha", "img": "img/q/8.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the region of the lung labeled C.", "type": "id", "choices": ["Right superior lobe", "Diaphragm", "Left superior lobe", "Right oblique fissure", "Cardiac notch"], "a": "Cardiac notch", "img": "img/q/9.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Which represents the correct anatomical sequence of air flow during inhalation, including the transition through upper and lower tracts?", "type": "mc", "choices": [], "a": "Nasal cavity -> Pharynx -> Larynx -> Trachea -> Primary bronchi -> Secondary bronchi -> Tertiary bronchi -> Bronchioles -> Terminal bronchioles -> Respiratory bronchioles -> Alveolar ducts -> Alveoli", "img": null}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "The trachea divides into ____ bronchi that lead to the lungs.", "type": "mc", "choices": ["3", "4", "5", "2"], "a": "2", "img": null}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Match the structure name with the letter (pharynx figure): Nasopharynx, Oropharynx, Pharynx, Laryngopharynx.", "type": "match", "choices": [], "a": "Nasopharynx = A; Oropharynx = B; Laryngopharynx = C; Pharynx (whole bracket) = D", "img": "img/q/12.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Match the structure name with the letter (lung histology + alveolar drawing): Alveolar sac, Respiratory bronchioles, Alveoli, Alveolar duct.", "type": "match", "choices": [], "a": "Respiratory bronchioles = A; Alveolar sac = B; Alveolar duct = C; Alveoli = D", "img": "img/q/13.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the structure labeled B (larynx, anterior and sagittal views).", "type": "id", "choices": ["Vestibular folds", "Hyoid bone", "Thyroid cartilage", "Cricoid cartilage", "Epiglottis", "Vocal folds", "Glottis"], "a": "Epiglottis", "img": "img/q/14.jpg"}, {"src": "Week 6B post-lab (Respiratory Anatomy)", "q": "Identify the structure labeled * (lung/thoracic wall inset).", "type": "id", "choices": ["Visceral pericardium", "Parietal pleura", "Parietal pericardium", "Visceral pleura", "Pulmonary arteries"], "a": "Parietal pleura", "img": "img/q/15.jpg"}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "The first heart sound heard in a cardiac cycle is from the ____.", "type": "mc", "choices": ["the ventricles contracting", "closure of the SL valves", "closure of the AV valves", "the atria contracting"], "a": "closure of the AV valves", "img": null}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "Systole refers to:", "type": "mc", "choices": ["atrial contraction", "atrial relaxation", "ventricular relaxation", "ventricular contraction"], "a": "ventricular contraction", "img": null}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "Match the function of inspiration or expiration with the correct respiratory muscle.", "type": "match", "choices": [], "a": "Abdominal muscles = depress the lower ribs and push up the diaphragm; Sternocleidomastoid = elevates the sternum; External intercostals = increase the width of the thoracic cavity; Diaphragm = increases the height of the thoracic cavity; Internal intercostal = contracts to pull the ribs down; Scalenes = elevate and fix the upper ribs", "img": null}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "Which artery is NOT one that a pulse is palpated on?", "type": "mc", "choices": ["radial artery", "brachial artery", "ulnar artery", "common carotid artery"], "a": "ulnar artery", "img": null}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "Match each lung capacity with its definition.", "type": "match", "choices": [], "a": "Total lung capacity = max air in lungs after maximum inspiratory effort; Functional residual capacity = air remaining in lungs after normal tidal expiration; Vital capacity = max air that can be expired after a maximum inspiratory effort; Inspiratory capacity = max air that can be inspired after normal tidal expiration", "img": null}, {"src": "Week 7A pre-lab (Resp & CV Physiology)", "q": "Match each respiratory volume with its definition.", "type": "match", "choices": [], "a": "Residual volume = air remaining in lungs after a forced expiration; Tidal volume = air inhaled or exhaled with each breath under resting conditions; Expiratory reserve volume = air that can be forcefully exhaled after a normal tidal expiration; Inspiratory reserve volume = air that can be forcefully inhaled after a normal tidal inspiration", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Heart murmurs ____.", "type": "mc", "choices": [], "a": "often indicate problems with heart valves, can be used to diagnose failure of the heart valves to close tightly, and can be used to diagnose constricted heart valves", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "During a cardiac cycle, the first heart sound 'lub' is heard. Which valves close and what is happening to the ventricles?", "type": "mc", "choices": [], "a": "Atrioventricular (mitral and tricuspid) valves close as the ventricles begin to contract.", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Match the term or definition with the correct letter on the spirogram (A-E).", "type": "match", "choices": [], "a": "Inspiratory reserve volume = A; Tidal volume (air in/out during relaxed breathing) = B; Expiratory reserve volume (air forcibly exhaled after a tidal expiration) = C; Residual volume = D; Vital capacity = E (bracket A+B+C)", "img": "img/q/24.jpg"}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "These muscles are active during quiet expiration.", "type": "mc", "choices": ["diaphragm", "internal intercostals", "None are active", "external intercostals"], "a": "None are active", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Which muscles are activated during forced expiration?", "type": "mc", "choices": ["the scalenes, sternocleidomastoid, and pectoralis minor muscles", "the internal intercostal, oblique, and transversus muscles", "the diaphragm and internal intercostal muscle", "the diaphragm and external intercostal muscles"], "a": "the internal intercostal, oblique, and transversus muscles", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "A person's heart rate is 73 bpm. How many 'lub' and 'dub' sounds in one minute?", "type": "mc", "choices": ["146 lub and 146 dub", "146 lub and 73 dub", "73 lub and 73 dub", "73 lub and 146 dub"], "a": "73 lub and 73 dub", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Tidal volume is ____.", "type": "mc", "choices": [], "a": "the amount of air inhaled or exhaled with each resting breath", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Arrange the anatomical sequence of air flow during inhalation: Larynx, Alveoli, Bronchi, Nasal cavity, Trachea, Pharynx, Bronchioles.", "type": "match", "choices": [], "a": "1 Nasal cavity, 2 Pharynx, 3 Larynx, 4 Trachea, 5 Bronchi, 6 Bronchioles, 7 Alveoli", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Which represents the correct anatomical sequence of air flow during exhalation?", "type": "mc", "choices": [], "a": "Alveoli -> Alveolar ducts -> Respiratory bronchioles -> Terminal bronchioles -> Bronchioles -> Tertiary bronchi -> Secondary bronchi -> Primary bronchi -> Trachea", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Identify the respiratory muscle labeled B (anterior chest, deep to pectoralis).", "type": "id", "choices": ["serratus anterior", "rectus abdominis", "sternocleidomastoid", "scalene muscles", "pectoralis minor"], "a": "serratus anterior", "img": "img/q/31.jpg"}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "In a clinical setting, how does Vital Capacity help distinguish types of pulmonary impairment?", "type": "mc", "choices": [], "a": "A reduction in VC is a hallmark sign of decreased lung compliance or 'stiff' lungs.", "img": null}, {"src": "Week 7B post-lab (Resp & CV Physiology)", "q": "Match each respiratory structure with its diagnostic histological feature.", "type": "match", "choices": [], "a": "Trachea = C-shaped hyaline cartilage rings, pseudostratified ciliated columnar epithelium with goblet cells; Bronchi = irregular plates of hyaline cartilage, smooth muscle, ciliated epithelium; Bronchiole = no cartilage, prominent smooth muscle, epithelium becomes simpler; Alveoli = thin-walled air sacs of simple squamous cells with surrounding capillaries, site of gas exchange", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "What are the 3 sections of the small intestine from proximal to distal?", "type": "mc", "choices": [], "a": "duodenum - jejunum - ileum", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "What is NOT part of the mucosa of the alimentary canal?", "type": "mc", "choices": ["lamina propria", "epithelium", "muscularis externa", "muscularis mucosae"], "a": "muscularis externa", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "Which is NOT one of the 3 major pairs of salivary glands?", "type": "mc", "choices": ["sublingual", "submandibular", "parotid", "pharyngeal"], "a": "pharyngeal", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "The liver has ____ lobes.", "type": "mc", "choices": ["3", "5", "4", "2"], "a": "4", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "What is NOT part of the portal triad?", "type": "mc", "choices": ["portal nerve", "bile duct", "portal venule", "portal arteriole"], "a": "portal nerve", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "Which is NOT a layer of the muscularis externa of the stomach?", "type": "mc", "choices": ["circular layer", "oblique layer", "transverse layer", "longitudinal layer"], "a": "transverse layer", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "Which structure is connected to the cecum?", "type": "mc", "choices": ["sigmoid colon", "anus", "transverse colon", "appendix"], "a": "appendix", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "The funnel-shaped pouch that forms the distal end of the stomach is the:", "type": "mc", "choices": ["pylorus", "cardia", "body", "fundus"], "a": "pylorus", "img": null}, {"src": "Week 8A pre-lab (Digestive System)", "q": "Where are most of the Peyer patches located?", "type": "mc", "choices": ["in the stomach", "in the duodenum", "in the ileum", "in the sigmoid colon"], "a": "in the ileum", "img": null}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (stomach, Fig 38.5a).", "type": "match", "choices": [], "a": "A = Gastroesophageal sphincter AND Cardia (both accepted); B = Fundus; C = Body; D = Rugae; E = Pylorus; F = Pyloric sphincter", "img": "img/q/43.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Identify the structure labeled D (sagittal peritoneum figure with color bars).", "type": "id", "choices": ["Lesser omentum", "Parietal peritoneum", "Visceral peritoneum", "Mesocolon", "Greater omentum", "Mesentery proper"], "a": "Greater omentum", "img": "img/q/44.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (liver, gallbladder, pancreas, duodenum).", "type": "match", "choices": [], "a": "Duodenum = A; Major duodenal papilla = B; Jejunum = C; Gall bladder = D; R hepatic lobe = E; L hepatic lobe = F; Pancreas = G", "img": "img/q/45.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Identify the structure labeled E (deciduous teeth).", "type": "id", "choices": ["molar", "premolar", "incisor", "canine"], "a": "molar", "img": "img/q/46.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (ducts of accessory digestive organs).", "type": "match", "choices": [], "a": "L/R hepatic duct(s) = A; Cystic duct = B; Common hepatic duct = C; Common bile duct = D; Hepatopancreatic ampulla AND Hepatopancreatic sphincter = E; Main pancreatic duct = F; Accessory pancreatic duct = G", "img": "img/q/47.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (large intestine, set 1).", "type": "match", "choices": [], "a": "Descending colon = G; Taenia coli = H; Sigmoid colon = I; Rectum = J; Anus = K; Anal sphincters = L", "img": "img/q/48.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the structures with their description.", "type": "match", "choices": [], "a": "Rugae = folds of gastric mucosa; Peyer's patches = large collections of lymphoid tissue in the mucosa of the small intestine; Hard palate = bone-supported anterosuperior boundary of the oral cavity; Circular folds = deep folds of mucosa and submucosa around the small intestine; Greater omentum = covers abdominal organs like an apron; Mesentery = suspends the small intestine from the posterior body wall", "img": null}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (large intestine, set 2).", "type": "match", "choices": [], "a": "Appendix = A; Cecum = B; Ileocecal valve = C; Ascending colon = D; Haustra = E (bracket); Transverse colon = F", "img": "img/q/50.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Match the letter with the correct label (alimentary canal wall layers).", "type": "match", "choices": [], "a": "Mucosa = A; Submucosa = B; Muscularis externa = C; Serosa = D", "img": "img/q/51.jpg"}, {"src": "Week 8B post-lab (Digestive Anatomy)", "q": "Identify the structure labeled C (salivary glands figure).", "type": "id", "choices": ["sublingual glands", "sublingual ducts", "submandibular ducts", "parotid glands", "submandibular glands", "parotid ducts"], "a": "submandibular ducts", "img": "img/q/52.jpg"}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "Bile ____.", "type": "mc", "choices": [], "a": "emulsifies fat, keeping tiny fat droplets suspended in the aqueous contents of the gut", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "Which best defines an enzyme and its mechanism?", "type": "mc", "choices": [], "a": "Enzymes are biological catalysts, typically proteins, that speed up chemical reactions by lowering the activation energy without being consumed.", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "The evidence that trypsin digests protein in the lab is ____.", "type": "mc", "choices": ["a negative starch test", "the presence of a pink color in the test tube", "a positive Benedict's test", "the presence of a yellow color in the test tube"], "a": "the presence of a yellow color in the test tube", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "What typically happens to a human enzyme if the temperature is raised significantly above body temperature?", "type": "mc", "choices": [], "a": "The enzyme changes its shape (denatures) and loses its ability to function.", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "The pancreas produces this protein-digesting enzyme.", "type": "mc", "choices": ["enterokinase", "dipeptidase", "pepsin", "trypsin"], "a": "trypsin", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "This enzyme, produced by the salivary glands, digests carbohydrates.", "type": "mc", "choices": ["amylase", "oligosaccharidase", "sucrase", "glucoamylase"], "a": "amylase", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "This fat-digesting enzyme does the major work of digesting fats in the small intestine.", "type": "mc", "choices": ["amylase", "pepsin", "ribonuclease", "lipase"], "a": "lipase", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "Fat digestion results in ____.", "type": "mc", "choices": ["glycerol", "fatty acids", "monoglycerides and fatty acids", "monoglycerides"], "a": "monoglycerides and fatty acids", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "This test detects starch in solution.", "type": "mc", "choices": ["litmus test", "Benedict's test", "IKI (Lugol's iodine) test"], "a": "IKI (Lugol's iodine) test", "img": null}, {"src": "Week 9 pre-lab (Digestive Processes)", "q": "Digestive enzymes ____.", "type": "mc", "choices": ["break down substrates by dehydration", "break down substrates by hydrolysis", "control the movement of food from one digestive organ to the next", "are produced only within the GI tract"], "a": "break down substrates by hydrolysis", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "In the lipid experiment, which tube is the control showing litmus cream does not change color without lipase?", "type": "mc", "choices": ["Tube 4L (Pancreatin + Litmus cream at a low temperature)", "Tube 1L (Pancreatin + Water)", "Tube 2L (Litmus cream + Water)", "Tube 3L (Pancreatin + Litmus cream at a high temperature)"], "a": "Tube 2L (Litmus cream + Water)", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "In Activity 2, what is the purpose of boiling trypsin before testing with BAPNA?", "type": "mc", "choices": ["To denature trypsin and observe the effect of heat on its ability to break down BAPNA.", "To convert BAPNA into a yellow-colored product through heat alone.", "To increase trypsin activity and produce a more intense yellow color.", "To increase the availability of BAPNA for trypsin binding."], "a": "To denature trypsin and observe the effect of heat on its ability to break down BAPNA.", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "What result would you expect from Benedict's test in tube 5A (amylase + starch at 37 C)?", "type": "mc", "choices": ["Negative (remains blue) because no starch was added.", "Positive (green, orange, or red) because Benedict's reagent detects starch.", "Positive (green, orange, or red) because starch was hydrolyzed into maltose.", "Negative (remains blue) because the enzyme was kept on ice."], "a": "Positive (green, orange, or red) because starch was hydrolyzed into maltose.", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "In Activity 2, comparing 4T (37 C) and 5T (0 C), what is the independent variable?", "type": "mc", "choices": ["The amount of trypsin added", "The amount of yellow product formed", "The temperature at which the reaction is incubated", "The amount of BAPNA substrate"], "a": "The temperature at which the reaction is incubated", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "In Activity 3 (temperature vs lipid digestion), which variables should be kept constant? Select all that apply.", "type": "mc", "choices": ["The color change of the litmus indicator", "The incubation temperature", "The incubation time", "The amount of pancreatin added to each test tube", "The total volume of solution added to each test tube", "The amount of litmus cream added to each test tube"], "a": "The incubation time; the amount of pancreatin added; the total volume of solution; the amount of litmus cream added", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "Why does litmus cream turn pink when lipid digestion occurs?", "type": "mc", "choices": ["Lipase converts fats into glucose, causing the solution to become acidic.", "Lipase releases amino acids, increasing the pH of the solution.", "Lipase releases fatty acids, lowering the pH of the solution", "Lipase releases glycerol, increasing the pH of the solution.", "Lipase releases fatty acids, increasing the pH of the solution"], "a": "Lipase releases fatty acids, lowering the pH of the solution", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "Match each indicator/reagent with its result.", "type": "match", "choices": [], "a": "Iodine solution = detects starch, blue-black when present; Litmus cream = detects pH change from fatty acid production by lipase; Benedict's reagent = detects reducing sugars like maltose, color change on heating; BAPNA = substrate for trypsin, cleavage gives a yellow product", "img": null}, {"src": "Week 9B post-lab (Digestive Processes)", "q": "In Activity 1 (amylase), what is the dependent variable? Select all that apply.", "type": "mc", "choices": ["The length of time incubated", "The incubation temperature", "The color change observed in the Benedict's reagent test", "The color change observed in the Lugol's iodine test", "The amount of amylase added"], "a": "The color change in the Benedict's test AND the color change in the Lugol's iodine test", "img": null}], "mcq": [{"q": "Which structure is part of the respiratory zone?", "c": ["Terminal bronchiole", "Tertiary bronchus", "Alveolar duct", "Trachea"], "a": "C", "e": "Respiratory zone = respiratory bronchioles, alveolar ducts, alveolar sacs, alveoli. Everything up to the terminal bronchioles is conducting zone."}, {"q": "The cartilage that forms a complete ring and connects the larynx to the trachea is the", "c": ["thyroid cartilage", "cricoid cartilage", "epiglottis", "arytenoid cartilage"], "a": "B", "e": "Cricoid is the only complete ring. Thyroid is the big shield (Adam's apple) above it."}, {"q": "Which lung has a horizontal fissure?", "c": ["Left only", "Right only", "Both", "Neither"], "a": "B", "e": "Right lung: horizontal + oblique fissures (3 lobes). Left: oblique only (2 lobes) plus the cardiac notch."}, {"q": "The vocal folds plus the opening between them form the", "c": ["vestibule", "glottis", "epiglottis", "carina"], "a": "B", "e": "Glottis. Vestibular folds (false cords) sit above them."}, {"q": "Which paranasal sinus is in the cheekbone below the eye?", "c": ["Frontal", "Sphenoid", "Maxillary", "Ethmoid"], "a": "C", "e": "Maxillary (largest). Frontal = above the eyebrows; sphenoid = posterior, behind the nasal cavity."}, {"q": "The pharyngotympanic (auditory) tube opens into the", "c": ["oropharynx", "laryngopharynx", "nasopharynx", "larynx"], "a": "C", "e": "Nasopharynx; it equalizes middle-ear pressure."}, {"q": "Which tonsil sits at the base of the tongue?", "c": ["Pharyngeal", "Palatine", "Lingual", "Tubal"], "a": "C", "e": "Lingual. Pharyngeal = posterior nasopharynx (adenoids); palatine = sides of the oropharynx."}, {"q": "The serous membrane that lines the thoracic wall is the", "c": ["visceral pleura", "parietal pleura", "visceral pericardium", "mediastinum"], "a": "B", "e": "Parietal = wall. Visceral = on the lung surface."}, {"q": "Pulmonary arteries carry", "c": ["oxygenated blood to the lungs", "deoxygenated blood to the lungs", "oxygenated blood to the heart", "deoxygenated blood to the body"], "a": "B", "e": "Arteries leave the heart. Pulmonary arteries leave the right ventricle with O2-poor blood."}, {"q": "According to Boyle's law, when thoracic volume increases, intrapulmonary pressure", "c": ["increases and air flows out", "decreases and air flows in", "stays the same", "decreases and air flows out"], "a": "B", "e": "Pressure and volume are inversely related; air moves from high to low pressure."}, {"q": "Quiet expiration is", "c": ["active, using the internal intercostals", "passive, from elastic recoil of the lungs", "active, using the abdominal muscles", "caused by the diaphragm contracting"], "a": "B", "e": "No muscles contract in quiet expiration; muscles relax and lungs recoil."}, {"q": "Which muscle is an accessory muscle of INSPIRATION?", "c": ["Internal intercostals", "Rectus abdominis", "Scalenes", "Transversus abdominis"], "a": "C", "e": "Scalenes elevate the first two ribs. The other three are forced expiration muscles."}, {"q": "Vital capacity equals", "c": ["TV + IRV", "TV + IRV + ERV", "ERV + RV", "TV + IRV + ERV + RV"], "a": "B", "e": "VC = TV + IRV + ERV. Add RV to get TLC."}, {"q": "Which CANNOT be measured with a spirometer?", "c": ["Tidal volume", "Vital capacity", "Residual volume", "Expiratory reserve volume"], "a": "C", "e": "RV never leaves the lungs, so it is estimated (RV = VC x age factor). Anything that includes RV (FRC, TLC) also cannot be measured directly."}, {"q": "A subject's TV is 500 ml and respiratory rate is 12/min. The minute respiratory volume is", "c": ["512 ml/min", "6000 ml/min", "4166 ml/min", "41.7 ml/min"], "a": "B", "e": "MRV = TV x respirations per minute = 500 x 12 = 6000 ml/min."}, {"q": "VC = 4500 ml, TV = 500 ml, ERV = 1000 ml. IRV =", "c": ["3000 ml", "3500 ml", "5500 ml", "4000 ml"], "a": "A", "e": "IRV = VC - (TV + ERV) = 4500 - 1500 = 3000 ml."}, {"q": "A markedly reduced vital capacity most suggests", "c": ["normal lungs", "restrictive disease with stiff, low-compliance lungs", "increased surfactant", "a larger residual volume only"], "a": "B", "e": "Clinical significance of VC: low VC = lungs cannot expand fully (fibrosis, restrictive disease, weak respiratory muscles)."}, {"q": "Hypoventilation (slow, shallow breathing) causes blood", "c": ["CO2 to fall and pH to rise", "CO2 to rise and pH to fall", "CO2 and pH to both rise", "no change"], "a": "B", "e": "Retained CO2 makes carbonic acid (CO2 + H2O to H2CO3 to H+ + HCO3-), so pH drops: respiratory acidosis."}, {"q": "The second heart sound (dup) is caused by", "c": ["AV valves closing", "semilunar valves closing", "atria contracting", "ventricles filling"], "a": "B", "e": "S2 = semilunar (aortic, pulmonary) valves closing at the start of ventricular diastole."}, {"q": "During isovolumetric contraction", "c": ["only the AV valves are open", "only the semilunar valves are open", "all four valves are closed", "all four valves are open"], "a": "C", "e": "Ventricles squeeze with all valves shut until pressure exceeds the arteries and the SL valves open."}, {"q": "The mitral valve is best heard at the", "c": ["2nd intercostal space, right sternal border", "2nd intercostal space, left sternal border", "5th intercostal space, left midclavicular line (apex)", "xiphoid process"], "a": "C", "e": "Aortic = 2nd ICS right; pulmonary = 2nd ICS left; tricuspid = 5th ICS near the sternum; mitral = apex, 5th ICS left midclavicular line."}, {"q": "Which layer of the alimentary canal contains the blood vessels, nerves and (in the duodenum) glands?", "c": ["Mucosa", "Submucosa", "Muscularis externa", "Serosa"], "a": "B", "e": "Submucosa: dense connective tissue with vessels, nerve plexus, lymphoid tissue and glands."}, {"q": "The stomach is unique because its muscularis externa has an extra", "c": ["circular layer", "oblique layer", "longitudinal layer", "transverse layer"], "a": "B", "e": "Oblique (innermost) layer lets the stomach churn."}, {"q": "Which tooth has the job of tearing and grasping?", "c": ["Incisor", "Canine", "Premolar", "Molar"], "a": "B", "e": "Incisors cut, canines tear, premolars and molars grind. Adult per quadrant: 2-1-2-3 = 32."}, {"q": "The lobe of the liver that sits next to the gall bladder on the inferior surface is the", "c": ["caudate lobe", "quadrate lobe", "left lobe", "right lobe"], "a": "B", "e": "Quadrate = next to the gall bladder; caudate = posterior, next to the inferior vena cava."}, {"q": "Bile leaving the gall bladder travels through the", "c": ["cystic duct, then common bile duct", "common hepatic duct, then cystic duct", "main pancreatic duct", "accessory pancreatic duct"], "a": "A", "e": "Gall bladder to cystic duct to common bile duct to hepatopancreatic ampulla to major duodenal papilla."}, {"q": "The fold that suspends the jejunum and ileum from the posterior abdominal wall is the", "c": ["greater omentum", "lesser omentum", "mesentery proper", "mesocolon"], "a": "C", "e": "Mesentery proper. Mesocolon holds the colon; omenta hang off the stomach."}, {"q": "Haustra are produced by the tone of the", "c": ["circular folds", "taenia coli", "rugae", "villi"], "a": "B", "e": "Three longitudinal muscle bands (taenia coli) pucker the colon into haustra."}, {"q": "Which structure regulates passage of material from the small intestine into the large intestine?", "c": ["Pyloric sphincter", "Ileocecal valve", "Gastroesophageal sphincter", "Hepatopancreatic sphincter"], "a": "B", "e": "The ileocecal valve sits between the ileum and the cecum."}, {"q": "A slide shows villi AND large blue lymphoid follicles in the submucosa. It is", "c": ["duodenum", "ileum", "colon", "stomach"], "a": "B", "e": "Peyer patches = ileum."}, {"q": "A slide shows villi AND pale mucous glands in the submucosa. It is", "c": ["duodenum", "ileum", "jejunum", "esophagus"], "a": "A", "e": "Duodenal (Brunner's) glands = duodenum."}, {"q": "A GI slide has no villi, and straight crypts full of goblet cells. It is", "c": ["stomach", "colon", "ileum", "esophagus"], "a": "B", "e": "Colon. Stomach also lacks villi but has gastric pits and pink parietal cells, no goblet cells."}, {"q": "Parietal cells of the stomach secrete", "c": ["pepsinogen", "HCl and intrinsic factor", "mucus only", "gastrin"], "a": "B", "e": "Parietal = HCl + intrinsic factor (pale pink, fried-egg look). Chief = pepsinogen (dark purple, gland base)."}, {"q": "Which epithelium lines the esophagus?", "c": ["Simple columnar", "Pseudostratified ciliated columnar", "Stratified squamous", "Simple squamous"], "a": "C", "e": "Stratified squamous protects against abrasion from the bolus."}, {"q": "Bronchioles differ from bronchi because bronchioles", "c": ["have cartilage plates", "lack cartilage and have a prominent smooth muscle layer", "are lined by stratified squamous epithelium", "have no lumen"], "a": "B", "e": "No cartilage, more smooth muscle, simpler epithelium."}, {"q": "In tube 4A, amylase was boiled before starch was added. The expected IKI result is", "c": ["negative, yellow", "positive, blue-black", "positive, orange precipitate", "negative, pink"], "a": "B", "e": "Denatured amylase cannot digest starch, so starch remains: IKI positive."}, {"q": "Which tube is the positive control for the Benedict's test?", "c": ["1A", "2A", "3A", "5A"], "a": "C", "e": "3A contains maltose, so it shows what a positive Benedict's looks like."}, {"q": "Tube 6A (amylase + starch at 0 C) most likely shows", "c": ["IKI negative, Benedict's positive", "IKI positive, Benedict's negative", "both negative", "both positive"], "a": "B", "e": "Cold slows enzyme activity, so starch remains and little maltose forms."}, {"q": "Why must the Benedict's test tubes be placed in boiling water?", "c": ["To denature the enzyme only", "Benedict's reagent needs heat to react with reducing sugars", "To dissolve the starch", "To turn the iodine black"], "a": "B", "e": "Benedict's is a heat-dependent test for reducing sugars like maltose."}, {"q": "Tube 4B turned pink faster than 4L because", "c": ["bile is a lipase", "bile salts emulsify fat, increasing surface area for lipase", "bile lowers the temperature", "bile adds acid to the tube"], "a": "B", "e": "Bile is not an enzyme; it physically breaks fat into droplets."}, {"q": "In the lipase experiment, acetic acid is added to 1L and 2L to", "c": ["start digestion", "make a pink color reference (color control)", "denature lipase", "emulsify the fat"], "a": "B", "e": "Gives the 'what does acidic look like' comparison color."}, {"q": "The independent variable when comparing tubes 4L (37 C) and 5L (0 C) is", "c": ["color of litmus", "incubation temperature", "amount of pancreatin", "incubation time"], "a": "B", "e": "The thing you changed on purpose. Color is the dependent variable; amount and time are controlled."}, {"q": "Which statement about the 0 C tubes is correct?", "c": ["The enzyme is permanently denatured", "Enzyme activity is slowed but the enzyme is not destroyed", "The enzyme works faster", "The substrate is destroyed"], "a": "B", "e": "Cold slows molecular motion; boiling denatures (permanent shape change)."}, {"q": "Trypsin and lipase both come from the", "c": ["salivary glands", "stomach", "pancreas", "liver"], "a": "C", "e": "Pancreatin = the pancreas's enzyme mix."}], "respFunc": [["Nasal cavity", "Warms, moistens and filters incoming air; mucous membrane traps debris"], ["Nasal conchae (superior, middle, inferior)", "Bony shelves that create turbulence so air contacts more mucosa: increases warming, humidifying and filtering"], ["Paranasal sinuses (frontal, maxillary, sphenoid, ethmoid)", "Lighten the skull, warm and moisten air, add resonance to the voice; drain into the nasal cavity"], ["Cribiform plate of ethmoid bone", "Roof of the nasal cavity; holes let olfactory nerve fibers pass to the brain (smell)"], ["Opening of pharyngotympanic tube", "Connects nasopharynx to the middle ear; equalizes pressure"], ["Nasopharynx", "Air only passageway; closed off by the soft palate and uvula during swallowing"], ["Oropharynx / Laryngopharynx", "Shared passageway for air AND food"], ["Pharyngeal tonsils (adenoids)", "Lymphoid tissue in posterior nasopharynx; immune defense"], ["Palatine tonsils", "Lymphoid tissue in the lateral oropharynx; immune defense"], ["Lingual tonsils", "Lymphoid tissue at base of the tongue; immune defense"], ["Uvula / soft palate", "Rise during swallowing to close the nasopharynx so food does not enter the nose"], ["Hyoid bone", "Not part of the larynx; anchors the larynx and tongue muscles"], ["Larynx", "Air passageway, keeps food out of the airway, houses the vocal folds (voice production)"], ["Epiglottis", "Elastic cartilage flap that covers the glottis/laryngeal inlet during swallowing"], ["Thyroid cartilage", "Largest laryngeal cartilage (Adam's apple); shields the vocal folds"], ["Cricoid cartilage", "Complete ring below the thyroid cartilage; connects larynx to trachea"], ["Vocal folds (true vocal cords)", "Vibrate as air passes to produce sound"], ["Vestibular folds (false vocal cords)", "Superior to vocal folds; help close the glottis during swallowing; no sound"], ["Glottis", "The vocal folds plus the opening (rima glottidis) between them"], ["Trachea", "Conducts air to bronchi; C-shaped hyaline cartilage rings keep it open; cilia sweep mucus up (mucociliary escalator)"], ["Carina", "Ridge where the trachea splits into the two primary bronchi; very sensitive, triggers the cough reflex"], ["Primary / secondary / tertiary bronchi", "Branching conducting tubes into each lung / each lobe / each bronchopulmonary segment"], ["Bronchioles", "Small airways (<1 mm) with no cartilage; smooth muscle controls airflow (bronchoconstriction / dilation)"], ["Alveoli", "Site of gas exchange; simple squamous (type I) cells plus surfactant-making type II cells"], ["Visceral pleura", "Serous membrane covering the lung surface"], ["Parietal pleura", "Serous membrane lining the thoracic wall and diaphragm; pleural fluid between the two reduces friction"], ["Pulmonary arteries", "Carry deoxygenated blood from the right ventricle to the lungs"], ["Cardia <script>
(function () {
"use strict";
var D = window.DATA;
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
var shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
var main = $("#main");

/* ---------- storage (per-browser convenience only) ---------- */
var KEY = "labex2-missed-v1";
var missed = {};
try { missed = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { missed = {}; }
function saveMissed() { try { localStorage.setItem(KEY, JSON.stringify(missed)); } catch (e) {} updateStats(); }
var session = { right: 0, total: 0 };
function mark(id, ok, info) {
  session.total++; if (ok) session.right++;
  if (ok) { if (missed[id]) { missed[id].streak = (missed[id].streak || 0) + 1; if (missed[id].streak >= 2) delete missed[id]; } }
  else { missed[id] = Object.assign({ streak: 0, t: Date.now() }, info); }
  saveMissed();
}
function updateStats() {
  var n = Object.keys(missed).length;
  $("#s-score").textContent = session.right + "/" + session.total;
  $("#s-miss").textContent = n;
  var tm = $("#tab-miss"); tm.textContent = n; tm.hidden = n === 0;
}

/* ---------- answer checking ---------- */
function norm(s) { return String(s).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
function variants(term) {
  var out = [term];
  var base = term.split(" (")[0]; out.push(base);
  var m = term.match(/\(([^)]+)\)/g); if (m) m.forEach(function (p) { out.push(p.slice(1, -1)); });
  base.split(/\s*\/\s*/).forEach(function (p) { if (p.length > 3) out.push(p); });
  base.split(":").forEach(function (p) { if (p.trim().length > 3) out.push(p); });
  return out.map(norm).filter(function (x) { return x.length > 1; });
}
function lev(a, b) {
  var m = a.length, n = b.length, d = [], i, j;
  for (i = 0; i <= m; i++) { d[i] = [i]; }
  for (j = 1; j <= n; j++) d[0][j] = j;
  for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function grade(input, term) {
  var x = norm(input); if (!x) return "no";
  var vs = variants(term), best = 99;
  for (var i = 0; i < vs.length; i++) {
    var v = vs[i];
    if (x === v || x === v.replace(/s$/, "") || x + "s" === v || x === v + "s") return "ok";
    best = Math.min(best, lev(x, v));
  }
  return best <= 2 ? "close" : "no";
}

/* ---------- router ---------- */
var VIEWS = { figures: viewFigures, histology: viewHistology, experiment: viewExperiment, quiz: viewQuiz, cards: viewCards, review: viewReview };
function route() {
  var h = (location.hash || "").replace("#", "");
  if (!VIEWS[h]) h = "figures";
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) { t.setAttribute("aria-selected", t.dataset.view === h ? "true" : "false"); });
  showActiveTab();
  main.innerHTML = "";
  VIEWS[h]();
  try { localStorage.setItem("labex2-view", h); } catch (e) {}
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
  t.addEventListener("click", function () { if (location.hash === "#" + t.dataset.view) route(); else location.hash = t.dataset.view; });
});
window.addEventListener("hashchange", route);

/* On narrow screens the tab row scrolls: keep the active tab in view and fade the edge that has more tabs. */
var tabBar = document.querySelector(".tabs");
function tabEdges() {
  var max = tabBar.scrollWidth - tabBar.clientWidth;
  tabBar.classList.toggle("more-l", tabBar.scrollLeft > 2);
  tabBar.classList.toggle("more-r", tabBar.scrollLeft < max - 2);
}
function showActiveTab() {
  var t = tabBar.querySelector('[aria-selected="true"]');
  if (t) {
    var left = t.offsetLeft - tabBar.offsetLeft, right = left + t.offsetWidth;
    if (left < tabBar.scrollLeft + 24) tabBar.scrollLeft = Math.max(0, left - 24);
    else if (right > tabBar.scrollLeft + tabBar.clientWidth - 24) tabBar.scrollLeft = right - tabBar.clientWidth + 24;
  }
  tabEdges();
}
tabBar.addEventListener("scroll", tabEdges, { passive: true });
window.addEventListener("resize", tabEdges);

/* =========================================================
   FIGURES
   ========================================================= */
var FS = { fig: 0, mode: "choose", tagOnly: true, order: [], pos: 0, results: {}, drill: null, pendingPin: null };
function figPins(f) {
  return f.pins.map(function (p, i) { return i; }).filter(function (i) { return !FS.tagOnly || f.pins[i].tag; });
}
function startFig(idx, keepPin) {
  FS.fig = idx; FS.results = {}; FS.drill = null;
  var f = D.figs[idx];
  FS.order = shuffle(figPins(f)); FS.pos = 0;
  if (keepPin != null) { var k = FS.order.indexOf(keepPin); if (k > 0) { FS.order.splice(k, 1); FS.order.unshift(keepPin); } else if (k < 0) FS.order.unshift(keepPin); }
}
function startDrill(list) {
  FS.drill = shuffle(list); FS.pos = 0; FS.results = {};
}
function curItem() {
  if (FS.drill) { var d = FS.drill[FS.pos]; return d ? { fi: d[0], pi: d[1] } : null; }
  var p = FS.order[FS.pos]; return p == null ? null : { fi: FS.fig, pi: p };
}
function viewFigures() {
  if (!FS.order.length && !FS.drill) startFig(0);
  var opts = "", sec = null;
  D.figs.forEach(function (f, i) {
    if (f.sec !== sec) { if (sec) opts += "</optgroup>"; sec = f.sec; opts += '<optgroup label="' + esc(sec) + '">'; }
    opts += '<option value="' + i + '">F' + f.num + " · " + esc(f.title) + " (" + f.pins.length + ")</option>";
  });
  opts += "</optgroup>";
  main.innerHTML =
    '<div class="view-head"><div><div class="eyebrow">Part A practice</div><h2>Name the pinned structure</h2>' +
    '<p>Every figure Dr. Rai posted, with each leader line turned into a numbered pin. Green check marks show answers that were graded on your own quizzes.</p></div></div>' +
    '<div class="fig-tools">' +
      '<select class="pick" id="fig-pick" aria-label="Choose a figure">' + opts + "</select>" +
      '<button class="btn" id="fig-prev" aria-label="Previous figure">&#8592;</button><button class="btn" id="fig-next" aria-label="Next figure">&#8594;</button>' +
      '<div class="seg" role="group" aria-label="Mode"><button data-m="choose">Choose</button><button data-m="type">Type</button><button data-m="study">Study</button></div>' +
      '<label class="tog"><input type="checkbox" id="fig-tag"> Tag list only</label>' +
      '<button class="btn ghost" id="fig-drill">Mixed drill</button>' +
    "</div>" +
    '<div class="fig-layout"><div class="panel stage" id="stage"></div><div class="panel ask" id="ask"></div></div>';
  $("#fig-pick").value = FS.fig;
  $("#fig-tag").checked = FS.tagOnly;
  $("#fig-pick").addEventListener("change", function () { startFig(+this.value); renderFig(); });

/* How it works: one plain-language walk through the whole experiment. Tube tables come from the same data as the tube drills. */

function renderGuide(body) {

        if (!ok) b.classList.add("wrong");
        QZ.done++; if (ok) QZ.right++; mark(id, ok, info);
        var fb = $("#qfb"); fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "Right. " : "Answer: <b>" + esc(ans) + "</b>. ") + (expl ? "<span style='color:var(--ink)'>" + esc(expl) + "</span>" : ""); next(fb);
      });
    });
  } else {
    card.innerHTML = head + '<p class="small">Answer it in your head (or out loud), then reveal.</p><button class="btn primary" id="qr">Reveal answer</button><div id="qfb"></div>';
    $("#qr").addEventListener("click", function () {
      this.remove();
      var fb = $("#qfb"); fb.innerHTML = '<div class="reveal">' + esc(ans) + '</div><div class="row" style="margin-top:10px"><button class="btn" id="qy">I had it</button><button class="btn" id="qn">I missed it</button></div>';
      var go = function (ok) { QZ.done++; if (ok) QZ.right++; mark(id, ok, info); QZ.pos++; renderQ(); };
      $("#qy").addEventListener("click", function () { go(true); }); $("#qn").addEventListener("click", function () { go(false); });
    });
  }
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
var CARDIAC = [
  ["Systole vs diastole", "Systole = contraction, diastole = relaxation. Plain 'systole' means ventricular contraction."],
  ["What opens and closes heart valves?", "Pressure differences. Valves are passive."],
  ["Ventricular filling (mid-to-late diastole)", "AV valves open, semilunar valves closed. Atrial systole tops off the ventricles."],
  ["Isovolumetric contraction", "All valves closed; ventricular pressure rising."],
  ["Ventricular ejection", "Semilunar valves open, AV valves closed."],
  ["Isovolumetric relaxation", "All valves closed (early diastole)."],
  ["First heart sound, 'lub'", "AV (mitral, tricuspid) valves close as the ventricles begin to contract. Longer and louder."],
  ["Second heart sound, 'dup'", "Semilunar (aortic, pulmonary) valves close at the start of ventricular relaxation."],
  ["Heart rate 73 bpm: lubs and dubs?", "73 lub and 73 dub."],
  ["Heart murmur", "Abnormal sound from turbulent flow: a leaky (insufficient) or narrowed (stenotic) valve."],
  ["Auscultation sites", "Aortic: 2nd ICS right sternal margin. Pulmonary: 2nd ICS left. Tricuspid: 5th ICS at the sternal margin. Mitral: 5th ICS left midclavicular line (apex)."],
  ["Pulse points", "Temporal, facial, common carotid, brachial, radial, femoral, popliteal, posterior tibial, dorsalis pedis. The quiz keyed ulnar as NOT a pulse point."],
  ["Boyle's law", "Pressure and volume are inversely related. Thoracic volume up, pressure down, air flows in."],
  ["Quiet expiration", "Passive: muscles relax and the lungs recoil. No muscles are active."],
  ["Bronchial vs vesicular sounds", "Bronchial: over trachea and large bronchi, loud and tubular. Vesicular: over lung periphery, soft and rustling."],
  ["Hyperventilation", "Blows off CO2: CO2 falls, pH rises (respiratory alkalosis)."],
  ["Hypoventilation", "CO2 builds up, carbonic acid rises, pH falls (respiratory acidosis)."],
  ["Clinical significance of vital capacity", "Reduced VC is a hallmark of decreased lung compliance (stiff lungs): restrictive disease, fibrosis, weak muscles. Obstructive disease mainly slows exhalation and traps air."],
  ["Spirometry formulas", "MRV = TV x breaths/min. IRV = VC - (TV + ERV). Predicted VC (male, L) = 0.052H - 0.022A - 3.60. RV = VC x age factor (16-34: 0.250, 35-49: 0.305, 50-69: 0.445)."]
];
var DECKS = [
  ["resp", "Respiratory functions", function () { return D.respFunc; }],
  ["dig", "Digestive functions", function () { return D.digFunc; }],
  ["musc", "Breathing muscles", function () { return D.muscles.map(function (m) { return [m[0], m[1] + ". " + m[2] + "."]; }); }],
  ["vol", "Volumes and capacities", function () { return D.volumes.map(function (v) { return [v[0] + " (" + v[1] + ")", v[2] + ". Male " + v[3] + ", female " + v[4] + (v[5] ? ". " + v[5] : "")]; }); }],
  ["phys", "Physiology and heart", function () { return CARDIAC; }],
  ["histo", "Histology features", function () { return D.histo.map(function (h) { return [h[0], h[3]]; }); }],
  ["ex39", "Ex 39 short answers", function () { return SHORT; }],
  ["order", "Put in order", null]
];
var FC = { deck: "resp", order: [], pos: 0, open: false };
function startDeck(k) { FC.deck = k; var d = deckData(k); FC.order = d ? shuffle(d.map(function (x, i) { return i; })) : []; FC.pos = 0; FC.open = false; }
function deckData(k) { for (var i = 0; i < DECKS.length; i++) if (DECKS[i][0] === k) return DECKS[i][2] ? DECKS[i][2]() : null; return null; }
function deckName(k) { for (var i = 0; i < DECKS.length; i++) if (DECKS[i][0] === k) return DECKS[i][1]; return k; }
function viewCards() {
  if (!FC.order.length && FC.deck !== "order") startDeck(FC.deck);
  main.innerHTML = '<div class="view-head"><div><div class="eyebrow">Recall</div><h2>Flashcards</h2><p>Say the answer, tap the card to check, then mark it. Cards you miss go to Review.</p></div></div>' +
    '<div class="deck-list" id="decks">' + DECKS.map(function (d) { return '<button data-d="' + d[0] + '">' + esc(d[1]) + "</button>"; }).join("") + '</div><div id="fc"></div>';
  Array.prototype.forEach.call(document.querySelectorAll("#decks button"), function (b) {
    b.setAttribute("aria-pressed", b.dataset.d === FC.deck ? "true" : "false");
    b.addEventListener("click", function () { startDeck(b.dataset.d); viewCards(); });
  });
  if (FC.deck === "order") renderOrder(); else renderCard();
}
function renderCard() {
  var d = deckData(FC.deck), box = $("#fc");
  if (FC.pos >= FC.order.length) { box.innerHTML = '<div class="panel flash" style="cursor:default"><div class="front">Deck done</div><div class="row"><button class="btn primary" id="fa">Shuffle and repeat</button></div></div>'; $("#fa").addEventListener("click", function () { startDeck(FC.deck); renderCard(); }); return; }
  var c = d[FC.order[FC.pos]];
  box.innerHTML = '<div class="panel flash" id="flash" role="button" tabindex="0" aria-label="Flip card"><div class="small">' + (FC.pos + 1) + " / " + FC.order.length + " · " + esc(deckName(FC.deck)) + '</div><div class="front">' + esc(c[0]) + "</div>" +
    (FC.open ? '<div class="back">' + esc(c[1]) + "</div>" : '<div class="small">Tap to reveal</div>') + "</div>" +
    (FC.open ? '<div class="row" style="margin-top:12px"><button class="btn primary" id="fy">Knew it</button><button class="btn" id="fn">Missed it</button></div>' : "");
  var flip = function () { if (!FC.open) { FC.open = true; renderCard(); } };
  $("#flash").addEventListener("click", flip);
  $("#flash").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  if (FC.open) {
    var go = function (ok) { mark("card:" + FC.deck + ":" + c[0], ok, { kind: "card", label: c[0], ans: c[1] }); FC.pos++; FC.open = false; renderCard(); };
    $("#fy").addEventListener("click", function () { go(true); }); $("#fn").addEventListener("click", function () { go(false); });
  }
}
var ORDERS = [["Airflow in: nose to alveoli", "airIn"], ["Food: mouth to anus", "food"], ["Bile: liver to duodenum", "bileFlow"]];
var OR = { k: 0, placed: [], pool: [] };
function renderOrder() {
  var box = $("#fc"), seq = D[ORDERS[OR.k][1]];
  if (!OR.pool.length && !OR.placed.length) OR.pool = shuffle(seq.map(function (s, i) { return i; }));
  box.innerHTML = '<div class="deck-list">' + ORDERS.map(function (o, i) { return '<button data-k="' + i + '" aria-pressed="' + (i === OR.k) + '">' + esc(o[0]) + "</button>"; }).join("") + "</div>" +
    '<div class="panel" style="padding:16px"><div class="eyebrow">Tap the stops in order</div><div class="chain" id="placed" style="margin:10px 0 14px">' +
    OR.placed.map(function (p, i) { return '<span class="slot ' + (p === i ? "ok" : "no") + '">' + (i + 1) + ". " + esc(seq[p]) + "</span>"; }).join("") + "</div>" +
    '<div class="chain" id="pool">' + OR.pool.map(function (p) { return '<button data-p="' + p + '">' + esc(seq[p]) + "</button>"; }).join("") + "</div>" +
    (OR.pool.length ? "" : '<div class="fb ' + (OR.placed.every(function (p, i) { return p === i; }) ? "ok" : "no") + '" style="margin-top:12px">' + OR.placed.filter(function (p, i) { return p === i; }).length + " of " + seq.length + " in the right spot.</div>") +
    '<div class="row" style="margin-top:12px"><button class="btn" id="or-reset">Start over</button><button class="btn ghost" id="or-show">Show correct order</button></div></div>';
  Array.prototype.forEach.call(box.querySelectorAll("[data-k]"), function (b) { b.addEventListener("click", function () { OR.k = +b.dataset.k; OR.placed = []; OR.pool = []; renderOrder(); }); });
  Array.prototype.forEach.call(box.querySelectorAll("#pool button"), function (b) {
    b.addEventListener("click", function () { var p = +b.dataset.p; OR.pool.splice(OR.pool.indexOf(p), 1); OR.placed.push(p);
      if (!OR.pool.length) { var ok = OR.placed.every(function (q, i) { return q === i; }); mark("order:" + OR.k, ok, { kind: "order", label: ORDERS[OR.k][0], ans: seq.join(" > ") }); }
      renderOrder(); });
  });
  $("#or-reset").addEventListener("click", function () { OR.placed = []; OR.pool = []; renderOrder(); });
  $("#or-show").addEventListener("click", function () { OR.placed = seq.map(function (s, i) { return i; }); OR.pool = []; renderOrder(); });
}

/* =========================================================
   REVIEW
   ========================================================= */
var RV = { confirm: false };
function viewReview() {
  var ids = Object.keys(missed).sort(function (a, b) { return (missed[b].t || 0) - (missed[a].t || 0); });
  var pinItems = ids.filter(function (k) { return missed[k].kind === "pin"; });
  main.innerHTML = '<div class="view-head"><div><div class="eyebrow">Your weak spots</div><h2>Review missed</h2><p>Everything you miss lands here. Get an item right twice in a row and it drops off. Saved in this browser only.</p></div>' +
    '<div class="row">' + (pinItems.length ? '<button class="btn primary" id="rv-drill">Drill missed pins (' + pinItems.length + ")</button>" : "") +
    (ids.length ? (RV.confirm ? '<span class="small">Clear all?</span><button class="btn" id="rv-yes">Yes, clear</button><button class="btn ghost" id="rv-no">Cancel</button>' : '<button class="btn ghost" id="rv-clear">Clear list</button>') : "") + "</div></div>" +
    (ids.length ? '<div class="miss">' + ids.map(function (k) {
      var m = missed[k];
      return '<div class="panel it"><div style="min-width:0"><div class="k">' + esc(m.kind) + '</div><div style="font-weight:700">' + esc(m.label || k) + '</div><div class="small" style="color:var(--ink)">' + esc(m.ans || "") + "</div></div>" +
        (m.kind === "pin" ? '<button class="btn" data-go="' + esc(k) + '">Retry</button>' : "") + "</div>";
    }).join("") + "</div>" : '<div class="panel empty">Nothing to review yet. Missed pins, cards, tubes and questions will show up here.</div>');
  var dr = $("#rv-drill");
  if (dr) dr.addEventListener("click", function () { FS.drill = shuffle(pinItems.map(function (k) { return [missed[k].fig, missed[k].pin]; })); FS.pos = 0; FS.results = {}; if (FS.mode === "study") FS.mode = "choose"; location.hash = "figures"; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
    b.addEventListener("click", function () { var m = missed[b.dataset.go]; startFig(m.fig, m.pin); if (FS.mode === "study") FS.mode = "choose"; location.hash = "figures"; });
  });
  var c = $("#rv-clear"); if (c) c.addEventListener("click", function () { RV.confirm = true; viewReview(); });
  var y = $("#rv-yes"); if (y) y.addEventListener("click", function () { missed = {}; saveMissed(); RV.confirm = false; viewReview(); });
  var n = $("#rv-no"); if (n) n.addEventListener("click", function () { RV.confirm = false; viewReview(); });
}

/* ---------- boot ---------- */
updateStats();
if (!location.hash) { var last = null; try { last = localStorage.getItem("labex2-view"); } catch (e) {} if (last && VIEWS[last]) { location.hash = last; } }
route();
})();
</script>
